# Converte o BioCLIP (imageomics/bioclip, licença MIT) para LiteRT com pesos INT8
# (tools/converter_bioclip_litert.py). O conversor litert-torch só existe para Linux/macOS, por isso
# roda aqui e não no Windows. O resultado fica em "Artifacts" na página da execução
# (bioclip-litert, ~180 MB): descompacte numa pasta e avalie no Windows com
#   python tools\avaliar_identificacao.py <fotos> --csv <planilha> --bioclip-litert <pasta>
# Roda manualmente (Actions > Converter BioCLIP > Run workflow) ou quando a ferramenta muda.
# Publica também os arquivos do app (sem o INT8 "só pesos") na Release de pré-lançamento
# MODELO_RELEASE, se ela ainda não existir: uma Release de modelo nunca é sobrescrita, porque
# assets/models/bioclip_modelo.json guarda o SHA-256 de cada arquivo. Modelo novo = MODELO_RELEASE novo.
name: Converter BioCLIP

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/converter_bioclip_litert.py"
      - ".github/workflows/converter-bioclip.yml"

permissions:
  contents: write

env:
  MODELO_RELEASE: modelo-bioclip-1

concurrency:
  group: bioclip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o conversor (torch só CPU)
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4,<2.15" torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "torch>=2.4,<2.15" open_clip_torch litert-torch==0.10.0

      - name: Converter
        run: python tools/converter_bioclip_litert.py --saida bioclip_litert

      - uses: actions/upload-artifact@v4
        with:
          name: bioclip-litert
          path: bioclip_litert/
          retention-days: 30
          compression-level: 0

      - name: Publicar a Release do modelo (só se ainda não existir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$MODELO_RELEASE" > /dev/null 2>&1; then
            echo "Release $MODELO_RELEASE já existe: nada publicado (troque MODELO_RELEASE para um modelo novo)."
            exit 0
          fi
          cd bioclip_litert
          gh release create "$MODELO_RELEASE" bioclip_imagem_int8d.tflite bioclip_textos.npy \
            bioclip_especies.txt bioclip_info.json --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Modelo de IA: BioCLIP INT8 ($MODELO_RELEASE)" \
            --notes "Arquivos da IA local do iBirder (BioCLIP, imageomics/bioclip, licença MIT, convertido para LiteRT INT8 dinâmico por tools/converter_bioclip_litert.py). Não é uma versão do app: o instalador já traz estes arquivos."
          python - <<'PY'
          import hashlib, json, os, pathlib
          arquivos = {}
          for nome in ("bioclip_imagem_int8d.tflite", "bioclip_textos.npy", "bioclip_especies.txt", "bioclip_info.json"):
              dados = pathlib.Path(nome).read_bytes()
              arquivos[nome] = {"bytes": len(dados), "sha256": hashlib.sha256(dados).hexdigest()}
          rel = os.environ["MODELO_RELEASE"]
          print(json.dumps({"modelo": "BioCLIP INT8 dinâmico", "release": rel,
                            "url_base": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{rel}/",
                            "arquivos": arquivos}, indent=2, ensure_ascii=False))
          PY
