# Testes + executável + instalador num Windows limpo.
# - Push na main, pull request e execução manual: checa o código (ruff), roda os testes, gera o executável, faz o autoteste
#   (--smoke-test) e o instalador, disponível em "Artifacts" na página da execução.
# - Tag vX.Y (ex.: v1.2): além disso, publica o instalador como Release no GitHub.
#   A tag precisa bater com APP_VERSION em core/config.py.
name: Build Windows

on:
  push:
    # Branches de trabalho rodam pelo pull_request (antes cada PR gerava dois builds iguais)
    branches: ["main"]
    tags: ["v*"]
    paths-ignore: ["**.md", "Geo/biomas.qmd"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest ruff==0.16.9

      - name: Checagem do código (ruff)
        run: ruff check .

      - name: Versão do app
        id: versao
        run: |
          $v = python -c "from core.config import APP_VERSION; print(APP_VERSION)"
          "versao=$v" >> $env:GITHUB_OUTPUT
          Write-Host "APP_VERSION = $v"

      - name: Baixar e conferir o modelo de IA (BioCLIP, Release do modelo)
        run: python -m core.model_manager

      - name: Testes (inclui mapa com QtWebEngine)
        env:
          IBIRDER_TESTES_GUI: "1"
        run: python -m pytest -q tests

      - name: Gerar executável (PyInstaller)
        run: pyinstaller -y ibirder.spec

      - name: Autoteste do executável (--smoke-test)
        run: |
          $proc = Start-Process -FilePath "dist\iBirder\iBirder.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          $log = Get-ChildItem "$env:APPDATA\iBirder\logs\sessao_*.log" -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime | Select-Object -Last 1
          if ($log) { Get-Content $log.FullName | Select-String "SMOKE|CHECKPOINT|ERROR|CRITICAL" }
          if ($proc.ExitCode -ne 0) { throw "Autoteste falhou (código $($proc.ExitCode))." }

      - name: Gerar instalador (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.versao.outputs.versao }}" instalador_ibirder.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou." }

      # Instala em silêncio 4 vezes e confere, pelo log do instalador, que ele reconhece a
      # instalação anterior (nenhuma, mais antiga, igual, mais nova). O aviso na tela só aparece
      # em instalação normal: esse teste fica para o Windows de verdade.
      - name: Conferir detecção de versão anterior no instalador
        run: |
          $exe = (Get-ChildItem dist_installer\*.exe | Select-Object -First 1).FullName
          $v = "${{ steps.versao.outputs.versao }}"
          $chave = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\iBirder_is1"
          function Instalar([string]$nome, [string]$esperado) {
            $log = Join-Path $env:RUNNER_TEMP "instalador_$nome.log"
            $p = Start-Process -FilePath $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Instalação '$nome' falhou (código $($p.ExitCode))." }
            $linha = (Select-String -Path $log -Pattern "\[iBirder\] anterior=" | Select-Object -First 1).Line
            Write-Host "${nome}: $linha"
            if ($linha -notlike "*$esperado*") { throw "Instalação '$nome': esperado '$esperado' no log." }
          }
          Instalar "primeira" "anterior=nenhuma nova=$v"
          $registrada = (Get-ItemProperty $chave).DisplayVersion
          if ($registrada -ne $v) { throw "DisplayVersion registrada = '$registrada', esperado '$v'." }
          Set-ItemProperty $chave DisplayVersion "0.9"
          Instalar "atualizacao" "anterior=0.9 nova=$v caso=atualizar"
          Instalar "mesma" "anterior=$v nova=$v caso=reinstalar"
          Set-ItemProperty $chave DisplayVersion "99.0"
          Instalar "rebaixar" "anterior=99.0 nova=$v caso=rebaixar"
          $chaves = Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" | Where-Object { $_.PSChildName -like "iBirder*" }
          if ($chaves.Count -ne 1) { throw "Esperada 1 entrada do iBirder em Programas instalados, há $($chaves.Count)." }
          if (-not (Test-Path "$env:ProgramFiles\iBirder\iBirder.exe")) { throw "iBirder.exe não está em Program Files." }

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Instalador_iBirder_v${{ steps.versao.outputs.versao }}
          path: dist_installer/*.exe
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Conferir tag x APP_VERSION
        id: versao
        run: |
          v=$(python3 -c "from core.config import APP_VERSION; print(APP_VERSION)")
          if [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não bate com APP_VERSION=$v em core/config.py"; exit 1
          fi
          echo "versao=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: Instalador_iBirder_v${{ steps.versao.outputs.versao }}
          path: instalador

      # A Release pode já existir quando a tag foi criada pela tela do GitHub
      # (Releases > Draft a new release): nesse caso só anexa o instalador.
      - name: Criar Release ou anexar o instalador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" instalador/*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" instalador/*.exe --title "iBirder $GITHUB_REF_NAME" --generate-notes
          fi
