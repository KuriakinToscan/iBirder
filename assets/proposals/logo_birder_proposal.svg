<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <desc>iBirder Logo Proposal - Stylized Bird</desc>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Stylized Bird Body -->
  <path d="M400,160 c0,0-40-60-120-60 s-140,80-140,160 s60,120,140,120 s120-60,120-140 Z" fill="url(#grad1)" />
  <!-- Wing -->
  <path d="M280,260 c0,0,40-40,100,0 c0,0-50,80-100,0 Z" fill="#2c3e50" opacity="0.8"/>
  <!-- Beak -->
  <path d="M400,200 L460,210 L400,230 Z" fill="#f1c40f" />
  <!-- Eye -->
  <circle cx="360" cy="190" r="10" fill="#ffffff" />
</svg>
